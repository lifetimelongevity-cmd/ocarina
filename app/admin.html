<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0c0e0a">
  <meta name="robots" content="noindex">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Quest Master">
  <title>Quest Master · Dennis Quest</title>
  <link rel="icon" type="image/png" sizes="32x32" href="assets/icons/admin-32.png">
  <link rel="apple-touch-icon" href="assets/icons/admin-180.png">
  <link rel="manifest" href="admin.webmanifest">
  <link rel="stylesheet" href="admin.css">
</head>
<body>
  <header class="top">
    <p class="probe-band" id="probeBand" hidden>Probelauf <a href="admin.html">Zum echten Spiel</a></p>
    <div class="top-row">
      <div class="brand-box">
        <strong class="brand">Quest Master</strong>
        <span class="sync" id="sync">…</span>
      </div>
      <button type="button" class="btn undo" id="undo" disabled><span>Rückgängig</span><small id="undoWas"></small></button>
    </div>
    <div class="top-row stats">
      <div class="stat"><b id="packs">0</b><small id="packsMax">/ 20</small><span class="lbl">Packs</span></div>
      <div class="stat code" id="code" aria-label="Code des Kästchens"></div>
    </div>
  </header>

  <main>
    <section class="probe-card" id="probeCard" hidden>
      <p class="hint">Dennis' Seite dazu: <b id="probeUrl">…/?probe</b></p>
      <div class="chips" id="szenarien"></div>
    </section>

    <section class="jetzt" id="nextCard">
      <h1 id="nextTitle">…</h1>
      <p class="wo" id="nextMeta"></p>
      <!-- Freigabe (30.09.): Dennis sieht die nächste Quest erst, wenn du sie hier freigibst. Kein GPS. -->
      <div class="frei" id="nextFrei" hidden>
        <button type="button" class="btn win frei-btn" id="freigeben">▶ Nächste Quest freigeben</button>
        <p class="hint" id="freiHint"></p>
      </div>
      <p class="fx" id="nextFx"></p>
      <p class="qm" id="nextQm"></p>
      <div class="use" id="nextUse"></div>
      <div class="duels" id="duels" hidden></div>
      <div class="lb" id="nextLogbuch" hidden></div>
      <div class="notfall">
        <span class="lbl">Notfall</span>
        <button type="button" class="btn win" id="nextWin">Bestanden</button>
        <button type="button" class="btn glanz" id="nextGlanz" hidden>Glanzsieg</button>
        <button type="button" class="btn lose" id="nextLose">Verloren</button>
      </div>
    </section>

    <section aria-labelledby="verlaufTitle">
      <h2 id="verlaufTitle">Verlauf</h2>
      <p class="hint" id="kappung" hidden></p>
      <ul class="verlauf" id="verlauf"></ul>
    </section>

    <section aria-label="Laufende Quest">
      <div class="lauf" id="lauf"></div>
    </section>

    <details>
      <summary>Quests <span class="count"><span id="done">0</span><span id="total">/ 10</span></span></summary>
      <ol class="quests" id="quests"></ol>
    </details>

    <details>
      <summary>Buchen</summary>
      <div class="chips" id="quick"></div>
      <div class="chips" id="buyDigits"></div>
      <form class="custom" id="customForm">
        <input id="customAmount" type="number" inputmode="numeric" step="1" value="-1" aria-label="Packs">
        <input id="customReason" type="text" placeholder="Grund" aria-label="Grund" autocomplete="off">
        <button type="submit" class="btn">Buchen</button>
      </form>
    </details>

    <details>
      <summary>Ausrüstung</summary>
      <div class="inv" id="inv" aria-label="Dennis besitzt"></div>
      <ul class="items" id="items"></ul>
    </details>

    <details>
      <summary>Tagebuch</summary>
      <ol class="lb-list" id="lbList"></ol>
    </details>

    <details>
      <summary>Spiel</summary>
      <p class="hint" id="storageInfo"></p>
      <div class="chips">
        <a class="btn ghost" id="dennisLink" href="./" target="_blank" rel="noopener">Dennis' Ansicht</a>
        <a class="btn ghost" id="probeLink" href="admin.html?probe">Probelauf öffnen</a>
        <a class="btn ghost" href="./?demo" target="_blank" rel="noopener">Demo</a>
      </div>
      <div class="chips">
        <button type="button" class="btn danger" id="resetLb">Tagebuch leeren</button>
        <button type="button" class="btn danger" id="reset">Alles zurücksetzen</button>
      </div>
    </details>
  </main>

  <div class="toast" id="toast" role="status"></div>

  <script src="config.js"></script>
  <script src="engine.js"></script>
  <script src="store.js"></script>
  <script src="admin.js"></script>
</body>
</html>
