<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
  <meta name="theme-color" content="#080907">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Dennis Quest">
  <meta name="robots" content="noindex">
  <title>Dennis Quest · Stilprobe</title>
  <link rel="icon" type="image/png" sizes="32x32" href="assets/icons/dennis-32.png">
  <link rel="apple-touch-icon" href="assets/icons/dennis-180.png">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="preload" as="image" href="assets/intro-titel.webp" fetchpriority="high">
  <link rel="preload" as="font" type="font/woff2" href="assets/nunito.woff2" crossorigin>
  <link rel="stylesheet" href="styles.css">
  <!-- Stilprobe (08-erlebnis-plan.md, Abschnitt 10): neuer Look als Schicht über styles.css. Die App (index.html) bleibt unverändert. -->
  <link rel="stylesheet" href="stilprobe.css">
  <script>
    // Stilprobe: ohne Zusatz gleich den Beispielstand der Tagesmitte zeigen, ohne Startbildschirm
    if (!location.search) history.replaceState(null, "", "?demo&direkt");
    // Android (Chrome, Samsung Internet): Angebot zum Installieren früh abfangen, app.js zeigt dafür den Knopf
    addEventListener("beforeinstallprompt", e => { e.preventDefault(); window.__installEvent = e; });
  </script>
</head>
<body>
  <!-- Stilprobe des Remasters (08-erlebnis-plan.md, Abschnitt 10). Gleiche Logik wie index.html, neuer Look aus stilprobe.css.
       Ohne Zusatz: Mitte des Tages. Auch ?demo=start&direkt, ?demo=bund&direkt, ?demo=ende&direkt.
       Dennis' Menü (06-design-plan.md, 07-spiele-und-items.md)
       /             liest den echten Stand (Firebase), schreibt nur Log-Buch-Antworten
       /?demo        Beispielstand mit Demo-Knöpfen, ohne Firebase (auch ?demo=start, ?demo=bund, ?demo=ende)
       /?onboarding  Prolog und Hinweise der Fee auch später am Tag (sonst nur, solange noch keine Quest entschieden ist)
       /?direkt      ohne Startbildschirm
       /?probe       Probelauf des Quest Masters (admin.html?probe), roter Rahmen, echtes Spiel unberührt -->
  <div class="game" id="game">
    <img class="world" src="assets/alpine-trail.webp" alt="" decoding="async">
    <div class="world-shade" aria-hidden="true"></div>

    <!-- Startbildschirm: Titelbild vom Nutzer. Die Fee ist aus dem Bild gelöst und schwebt,
         Licht, Feenstaub und Glühwürmchen bewegen sich (app.js, Abschnitt Startbildschirm) -->
    <section class="intro-screen" id="introScreen" aria-label="Startbildschirm: The Legend of Dennis, A Link to Rike">
      <div class="intro-scene">
        <div class="intro-cam">
          <img class="intro-bg" src="assets/intro-titel.webp" alt="" draggable="false" decoding="async" fetchpriority="high">
          <span class="intro-sun" aria-hidden="true"></span>
          <span class="intro-rays" aria-hidden="true"><i style="--x:16.8%;--w:5.5%;--d:9s;--o:.8"></i><i style="--x:44%;--w:7%;--d:8s;--o:.75"></i><i style="--x:51.5%;--w:4.5%;--d:12s;--o:.55"></i></span>
          <span class="intro-path-light" aria-hidden="true"></span>
          <img class="intro-fee" id="introFee" src="assets/intro-fee.png" alt="" draggable="false">
          <canvas class="intro-fx" id="introFx" aria-hidden="true"></canvas>
        </div>
        <button class="start-quest" id="startQuest" type="button">PRESS START</button>
      </div>
      <button class="install-btn" id="installBtn" type="button" hidden>
        <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2.6" d="M12 3v11m-4.5-4.5L12 14l4.5-4.5M4 16v3a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-3"/></svg>
        <span>APP INSTALLIEREN</span>
      </button>
      <button class="fullscreen-toggle" id="fullscreenToggle" type="button" aria-label="Vollbild öffnen" aria-pressed="false" title="Vollbild">
        <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2.4" d="M3 8V5a2 2 0 0 1 2-2h3m8 0h3a2 2 0 0 1 2 2v3m0 8v3a2 2 0 0 1-2 2h-3m-8 0H5a2 2 0 0 1-2-2v-3"/></svg>
      </button>
    </section>

    <!-- HUD: immer sichtbar. Links die Packs, Mitte die nächste Quest, rechts der Code des Kästchens -->
    <header class="hud">
      <button class="hud-packs" id="hudPacks" type="button" aria-label="Packs">
        <span class="pack-row" id="packRow" aria-hidden="true"></span>
        <span class="hud-num"><b id="packsVal">0</b></span>
      </button>
      <button class="hud-next" id="hudNext" type="button">
        <span class="hud-next-name" id="hudNextName">…</span>
      </button>
      <button class="hud-code" id="hudCode" type="button" aria-label="Code des Kästchens">
        <svg class="lock" aria-hidden="true"><use href="#i-lock"></use></svg>
        <span class="tumblers" id="tumblers"></span>
      </button>
    </header>

    <button class="shoulder shoulder-left" type="button" data-nav="prev" aria-label="Vorherige Seite (Z)"><span>Z</span></button>
    <button class="shoulder shoulder-right" type="button" data-nav="next" aria-label="Nächste Seite (R)"><span>R</span></button>

    <div class="stage">
      <div class="menu-viewport">
        <div class="menu-cube flat" id="menuCube">

          <!-- Seite 0: KARTE · Nur das Wo: Weg, Stationen, Nebel, Dennis. Die Karte ist zugleich der Fortschritt.
               Tippen auf eine Station öffnet ihre Quest auf QUESTS, die Hütte zeigt den Code (08-erlebnis-plan.md, Abschnitt 11). -->
          <section class="face face-map" data-page="0" aria-label="Karte">
            <header class="face-head">
              <h2>KARTE</h2>
            </header>
            <div class="map-body">
              <div class="map-sheet" id="mapSheet">
                <svg class="map-terrain" viewBox="0 0 1000 420" preserveAspectRatio="none" aria-hidden="true">
                  <path class="t-sky" d="M0 0H1000V420H0Z"/>
                  <path class="t-back" d="M0 200 C90 150 170 170 250 130 C330 90 380 110 450 90 C540 60 600 80 680 50 C730 30 780 40 830 36 C900 30 950 60 1000 50 V420 H0Z"/>
                  <path class="t-front" d="M0 300 C120 270 200 282 300 240 C400 200 470 214 560 180 C650 146 720 122 780 104 C840 118 900 160 1000 190 V420 H0Z"/>
                  <path class="t-forest" d="M316 292 l14 -30 14 30Z M346 286 l12 -26 12 26Z M392 262 l14 -30 14 30Z M424 258 l12 -26 12 26Z M512 236 l14 -30 14 30Z M544 230 l12 -26 12 26Z M600 204 l14 -30 14 30Z M632 196 l12 -26 12 26Z M688 176 l12 -26 12 26Z"/>
                  <path class="t-lake" d="M0 336 C110 318 210 342 300 328 C380 316 440 352 480 420 H0Z"/>
                  <path class="t-rail" d="M0 392 C40 376 70 352 100 332"/>
                  <path class="t-route" id="mapRoute" d=""/>
                </svg>
                <!-- Der gegangene Weg in eigener Ebene: Beim Laufen wird nur sie neu gezeichnet, nicht das ganze Gelände -->
                <svg class="map-weg" viewBox="0 0 1000 420" preserveAspectRatio="none" aria-hidden="true"><path class="t-done-rand" id="mapDoneRand" d=""/><path class="t-done" id="mapDone" d=""/></svg>
                <div class="map-fog" id="mapFog" hidden></div>
                <div class="map-marks" id="mapMarks"></div>
                <span class="map-walker" id="mapWalker" hidden aria-hidden="true"></span>
                <span class="map-gps" id="mapGps" hidden title="Hier bist du laut GPS"></span>
                <!-- Kartusche: Höhe, Strecke bis zum Gipfel, Höhenprofil des echten Wegs, GPS -->
                <div class="map-legend" id="mapLegend">
                  <div class="ml-top">
                    <svg class="ml-ico" aria-hidden="true"><use href="#i-mountain"></use></svg>
                    <p class="ml-now"><b id="mlWert">–</b> <span id="mlWo"></span></p>
                    <button class="ml-gps" id="gpsBtn" type="button" aria-pressed="false" aria-label="GPS: zeig mir, wo ich am Weg bin"><svg aria-hidden="true"><use href="#i-gps"></use></svg><span>GPS</span></button>
                  </div>
                  <p class="ml-rest" id="mlRest"></p>
                  <div class="ml-profil" id="mlProfil" aria-hidden="true">
                    <svg viewBox="0 0 200 40" preserveAspectRatio="none"><path class="p-area" id="mlArea" d=""/><path class="p-line" id="mlLine" d=""/></svg>
                  </div>
                </div>
                <!-- Stationstafel: erscheint beim Antippen einer Station -->
                <div class="station-card textbox" id="stationCard" hidden aria-live="polite"></div>
              </div>
            </div>
          </section>

          <!-- Seite 1: QUESTS · Nur das Was: was dran ist, was geschafft ist, was auf dem Spiel steht (Startseite) -->
          <section class="face face-quests" data-page="1" aria-label="Quests">
            <header class="face-head">
              <h2>QUESTS</h2>
            </header>
            <div class="quests-body">
              <div class="list-col">
                <ol class="quest-list" id="questList"></ol>
              </div>
              <article class="quest-card textbox" id="questCard" aria-live="polite"></article>
            </div>
          </section>

          <!-- Seite 2: AUSRÜSTUNG · Was habe ich dabei? Links der Beutel (Items), Mitte Dennis im Bogenfenster,
               rechts Runenkreise (Fähigkeiten). Noch nicht Erspieltes ist ein Schatten. -->
          <section class="face face-equip" data-page="2" aria-label="Ausrüstung">
            <header class="face-head">
              <h2>AUSRÜSTUNG</h2>
            </header>
            <div class="equip-body">
              <div class="equip-group bag">
                <p class="lbl plakette">ITEMS</p>
                <div class="slots" id="slotsGear"></div>
              </div>
              <div class="character-window" id="charWindow">
                <span class="cw-licht" aria-hidden="true"></span>
                <img src="assets/avatar-okarina.webp" alt="Dennis spielt Okarina" width="560" height="1218" decoding="async">
                <span class="motes" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i></span>
                <span class="notes" aria-hidden="true"><i>♪</i><i>♫</i><i>♪</i></span>
              </div>
              <div class="equip-group magic">
                <p class="lbl plakette">FÄHIGKEITEN</p>
                <div class="slots" id="slotsSkill"></div>
              </div>
              <div class="item-box textbox" id="itemBox" aria-live="polite"></div>
            </div>
          </section>

        </div>
      </div>
    </div>

    <footer class="foot">
      <b class="probe-tag">PROBE</b>
      <span class="demo-bar" id="demoBar" hidden>
        <b>DEMO</b>
        <button type="button" data-demo="bestanden">Nächste bestanden</button>
        <button type="button" data-demo="verloren">Nächste verloren</button>
        <button type="button" data-demo="zurueck">Zurück</button>
        <button type="button" data-demo="einsetzen">Einsetzen</button>
        <button type="button" data-demo="amulett">Amulett</button>
      </span>
      <span class="sync" id="sync"></span>
    </footer>

    <!-- Ergebnis-Fenster: erscheint, wenn der Quest Master etwas bucht -->
    <div class="coach" id="coach" hidden><p class="coach-bubble" role="status"><img class="coach-fee" src="assets/fee.png" loading="lazy" alt="" aria-hidden="true"><span class="coach-text"></span><span class="result-more" aria-hidden="true">▼</span></p></div>

    <!-- Prolog: einmal pro Handy nach dem ersten PRESS START. Rikes Fee stellt sich vor, heißt Dennis willkommen und erklärt in sechs Tafeln, worum es geht. -->
    <section class="prolog" id="prolog" hidden aria-label="Prolog">
      <button class="prolog-skip" id="prologSkip" type="button">ÜBERSPRINGEN</button>
      <div class="prolog-stage">
        <img class="prolog-fee" id="prologFee" src="assets/fee.png" loading="lazy" alt="" draggable="false">
        <div class="prolog-bild" id="prologBild" aria-hidden="true"></div>
      </div>
      <div class="prolog-box textbox" role="dialog" aria-modal="true" aria-labelledby="prologText">
        <p class="prolog-text" id="prologText"></p>
        <span class="prolog-dots" id="prologDots" aria-hidden="true"></span>
        <span class="result-more" aria-hidden="true">▼</span>
      </div>
    </section>
    <div class="overlay" id="overlay" hidden>
      <div class="result textbox" role="dialog" aria-modal="true" aria-labelledby="resultTitle">
        <div class="result-head" id="resultHead"></div>
        <ul class="result-lines" id="resultLines"></ul>
        <p class="result-next" id="resultNext"></p>
        <span class="result-more" aria-hidden="true">▼</span>
      </div>
    </div>

    <!-- Log-Buch: Dennis tippt seine Antwort, besiegelt sie, dann spielt Rikes Sprachnachricht (app.js, Abschnitt Log-Buch) -->
    <div class="logbuch" id="logbuch" hidden>
      <div class="lb-panel textbox" role="dialog" aria-modal="true" aria-labelledby="lbTitle">
        <header class="lb-head">
          <span class="medal won" style="--m:#4a8fe8"><svg aria-hidden="true"><use href="#z-water"></use></svg></span>
          <p class="tb-title" id="lbTitle">RIKES TAGEBUCH</p>
          <p class="lb-step" id="lbStep"></p>
          <button type="button" class="lb-close" id="lbClose" aria-label="Tagebuch schließen">✕</button>
        </header>
        <p class="lb-frage" id="lbFrage"></p>
        <form class="lb-form" id="lbForm">
          <textarea id="lbInput" rows="2" maxlength="300" enterkeyhint="done" autocomplete="off" autocapitalize="sentences" placeholder="Ein bis drei Worte" aria-label="Was hat Rike gesagt?"></textarea>
          <button type="submit" class="lb-btn" id="lbSeal"><svg aria-hidden="true"><use href="#i-seal"></use></svg>BESIEGELN</button>
        </form>
        <div class="lb-sealed" id="lbSealed" hidden>
          <p class="lb-antwort"><svg class="lb-wachs" aria-hidden="true"><use href="#i-seal"></use></svg><span id="lbAntwort"></span></p>
          <div class="lb-voice">
            <button type="button" class="lb-play" id="lbPlay" aria-label="Rikes Nachricht abspielen"><svg aria-hidden="true"><use href="#i-play"></use></svg></button>
            <span class="lb-wave" id="lbWave" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i><i></i><i></i><i></i><i></i></span>
            <span class="lb-who" id="lbWho">RIKE</span>
          </div>
          <button type="button" class="lb-btn" id="lbNext">WEITER</button>
        </div>
      </div>
    </div>

    <!-- Siegel: Dennis besiegelt selbst (Ergebnis, Einsatz, Duell, Amulett, Ziffer). Gedrückt halten, bis der Ring zu ist (app.js, Abschnitt Siegel). -->
    <div class="schwur" id="schwur" hidden>
      <div class="sw-panel textbox" role="dialog" aria-modal="true" aria-labelledby="swArt">
        <p class="sw-art" id="swArt"></p>
        <div class="sw-kopf" id="swKopf"></div>
        <ul class="sw-folgen" id="swFolgen"></ul>
        <div class="sw-wahl" id="swWahl"></div>
        <div class="sw-unten">
          <button type="button" class="sw-zurueck" id="swZurueck">ZURÜCK</button>
          <p class="sw-hinweis">Siegel gedrückt halten</p>
          <button type="button" class="sw-siegel" id="swSiegel" aria-label="Siegel gedrückt halten zum Besiegeln">
            <svg class="sw-ring" viewBox="0 0 100 100" aria-hidden="true"><circle class="sw-ring-bg" cx="50" cy="50" r="44"/><circle class="sw-ring-voll" cx="50" cy="50" r="44" pathLength="100"/></svg>
            <svg class="sw-wachs" aria-hidden="true"><use href="#i-seal"></use></svg>
          </button>
        </div>
      </div>
    </div>

    <div class="rotate-hint" aria-hidden="true">
      <div class="phone"></div>
      <p>Handy quer halten</p>
    </div>
    <div class="dither" aria-hidden="true"></div>
  </div>

  <svg class="svg-sprite" aria-hidden="true">
    <!-- Pack: Spielkarte im Goldrahmen -->
    <symbol id="i-card" viewBox="0 0 22 30">
      <rect x="1" y="1" width="20" height="28" rx="2.6" fill="#f2c94c" stroke="#3b2605" stroke-width="1.4"/>
      <rect x="3.8" y="3.8" width="14.4" height="22.4" rx="1.2" fill="#b3261e"/>
      <path d="M11 8.2a4.3 4.3 0 0 1 4.3 4.3c0 1.7-.9 2.7-1.9 3.3v1.6H8.6v-1.6c-1-.6-1.9-1.6-1.9-3.3A4.3 4.3 0 0 1 11 8.2Z" fill="#fff3d1"/>
      <circle cx="9.4" cy="12.6" r="1.05" fill="#b3261e"/><circle cx="12.6" cy="12.6" r="1.05" fill="#b3261e"/>
      <path d="M6.4 20.4 15.6 23.6M15.6 20.4 6.4 23.6" stroke="#fff3d1" stroke-width="1.6" stroke-linecap="round"/>
    </symbol>
    <!-- Pack, der noch dem Bund gehört: Kartenrücken -->
    <symbol id="i-card-empty" viewBox="0 0 22 30">
      <rect x="1" y="1" width="20" height="28" rx="2.6" fill="#221f17" stroke="#8a7a4e" stroke-width="1.3"/>
      <rect x="3.7" y="3.7" width="14.6" height="22.6" rx="1.3" fill="none" stroke="#4f4632" stroke-width="1"/>
      <path d="M11 9.2 15.2 15 11 20.8 6.8 15Z" fill="#2e2a1e" stroke="#9a8854" stroke-width="1.1"/>
      <circle cx="11" cy="15" r="1.3" fill="#9a8854"/>
    </symbol>
    <symbol id="i-lock" viewBox="0 0 24 28">
      <path d="M6.5 12.5V8.5a5.5 5.5 0 0 1 11 0v4" fill="none" stroke="currentColor" stroke-width="3"/>
      <rect x="2" y="11.5" width="20" height="15.5" rx="2.5" fill="currentColor"/>
      <circle cx="12" cy="17.6" r="2.3" fill="#1c1a12"/><rect x="10.9" y="18.6" width="2.2" height="4.6" rx="1" fill="#1c1a12"/>
    </symbol>
    <!-- Items -->
    <!-- Beutel: Lederbeutel mit Kordel (Startitem) -->
    <symbol id="i-beutel" viewBox="0 0 32 32">
      <path fill="currentColor" d="M9.2 3.6c2.1 1.5 4.4 2.1 6.8 2.1s4.7-.6 6.8-2.1l-2.2 7.2h-9.2Z"/>
      <path fill="currentColor" d="M11.1 11.4h9.8c4.7 2.6 7.8 6.9 7.8 10.9 0 4.5-5.3 6.9-12.7 6.9S3.3 26.8 3.3 22.3c0-4 3.1-8.3 7.8-10.9Z"/>
      <rect x="9.8" y="9.5" width="12.4" height="3.3" rx="1.65" fill="rgba(0,0,0,.45)"/>
      <path d="M19.6 12.4c.5 2.3 2.1 3.6 4 4.5M18.7 12.6c-.3 2.5.5 4.2 1.7 5.7" fill="none" stroke="rgba(0,0,0,.42)" stroke-width="1.3" stroke-linecap="round"/>
      <circle cx="19.2" cy="11.15" r="1.75" fill="rgba(255,255,255,.45)"/>
      <path d="M13.1 6.6l.7 2.9M16 6.9v2.7M18.9 6.6l-.7 2.9" stroke="rgba(0,0,0,.3)" stroke-width="1.1" stroke-linecap="round"/>
      <path d="M8.4 18.8c.8-2.1 2.3-3.8 4.1-5" fill="none" stroke="rgba(255,255,255,.42)" stroke-width="1.9" stroke-linecap="round"/>
      <path d="M8 25.2c2.4 1.3 5.1 1.8 8 1.8" fill="none" stroke="rgba(0,0,0,.25)" stroke-width="1.4" stroke-linecap="round"/>
    </symbol>
    <!-- Runenkreis um jede Fähigkeit: dreht sich, solange sie Dennis gehört -->
    <symbol id="i-rune" viewBox="0 0 100 100">
      <circle cx="50" cy="50" r="46.5" fill="none" stroke="currentColor" stroke-width="1.6" opacity=".8"/>
      <circle cx="50" cy="50" r="41" fill="none" stroke="currentColor" stroke-width="5.5" stroke-dasharray="1.4 5.04 3.6 5.04 1.4 5.04" opacity=".75"/>
      <circle cx="50" cy="50" r="35.5" fill="none" stroke="currentColor" stroke-width="1" stroke-dasharray="14 3 2 3" opacity=".55"/>
      <path fill="currentColor" d="M50 0l3.4 5.6h-6.8ZM50 100l-3.4-5.6h6.8ZM0 50l5.6-3.4v6.8ZM100 50l-5.6 3.4v-6.8Z"/>
    </symbol>
    <!-- Wasserwaffen in drei Stufen: Spritze (Start, aus dem Beutel), kleine Pistole, große Pistole -->
    <symbol id="i-spritze" viewBox="0 0 32 32"><g transform="rotate(-38 16 16)"><g fill="currentColor"><rect x="2.2" y="12.4" width="2.2" height="7.2" rx=".8"/><rect x="4" y="15" width="5.4" height="2"/><rect x="8.2" y="10.2" width="1.9" height="11.6" rx=".7"/><rect x="9.6" y="12" width="12.6" height="8" rx="1.6"/><path d="M22 14.1 26.2 15.2 29.6 16 26.2 16.8 22 17.9Z"/></g><path d="M13.4 12v3.2M16.4 12v3.2M19.4 12v3.2" stroke="rgba(0,0,0,.38)" stroke-width="1.1"/><rect x="10.8" y="17.2" width="10" height="1.4" rx=".7" fill="rgba(255,255,255,.4)"/></g></symbol>
