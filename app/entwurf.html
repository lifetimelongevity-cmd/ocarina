<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#07120d">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Dennis Quest">
  <meta name="robots" content="noindex">
  <title>Dennis Quest · Entwurf</title>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cpath fill='%23e6bb38' d='M16 3 29 26H3z'/%3E%3Cpath fill='%2307120d' d='M9.5 14.5h13L16 26z'/%3E%3C/svg%3E">
  <link rel="apple-touch-icon" href="assets/touch-icon.png">
  <link rel="preload" href="assets/hylia-serif.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="assets/menue-wald.webp" as="image">
  <link rel="stylesheet" href="entwurf.css">
</head>
<body>
  <!-- ENTWURF zu 06-design-plan.md und 07-menue-umbau.md. Die App (index.html) bleibt unverändert, bis der Plan freigegeben ist.
       entwurf.html          liest den echten Stand (Firebase), schreibt nichts
       entwurf.html?demo     Beispielstand aus 05-system-plan.md A9, mit Demo-Knöpfen, ohne Firebase
       entwurf.html?direkt   ohne Startbildschirm -->
  <div class="game" id="game">
    <!-- Hintergrund des Menüs: das Titelbild, unscharf, im selben Zuschnitt wie der Startbildschirm -->
    <div class="world" aria-hidden="true">
      <div class="world-scene"><div class="world-cam" id="worldCam"><img src="assets/menue-wald.webp" alt=""></div></div>
      <div class="world-shade"></div>
    </div>
    <canvas class="bg-fx" id="bgFx" aria-hidden="true"></canvas>

    <!-- Startbildschirm: Titelbild vom Nutzer. Die Fee ist aus dem Bild gelöst und schwebt,
         Licht, Feenstaub und Glühwürmchen bewegen sich (entwurf.js, Abschnitt Startbildschirm) -->
    <section class="intro-screen" id="introScreen" aria-label="Startbildschirm: The Legend of Dennis, A Link to Rieke">
      <div class="intro-scene">
        <div class="intro-cam" id="introCam">
          <img class="intro-bg" src="assets/intro-titel.webp" alt="" draggable="false">
          <span class="intro-sun" aria-hidden="true"></span>
          <span class="intro-rays" aria-hidden="true"><i style="--x:16.8%;--w:5.5%;--d:9s;--o:.8"></i><i style="--x:44%;--w:7%;--d:8s;--o:.75"></i><i style="--x:51.5%;--w:4.5%;--d:12s;--o:.55"></i></span>
          <span class="intro-path-light" aria-hidden="true"></span>
          <img class="intro-fee" id="introFee" src="assets/intro-fee.png" alt="" draggable="false">
          <canvas class="intro-fx" id="introFx" aria-hidden="true"></canvas>
        </div>
        <button class="start-quest" id="startQuest" type="button">PRESS START</button>
      </div>
      <button class="fullscreen-toggle" id="fullscreenToggle" type="button" aria-label="Vollbild öffnen" aria-pressed="false" title="Vollbild">
        <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2.4" d="M3 8V5a2 2 0 0 1 2-2h3m8 0h3a2 2 0 0 1 2 2v3m0 8v3a2 2 0 0 1-2 2h-3m-8 0H5a2 2 0 0 1-2-2v-3"/></svg>
      </button>
    </section>

    <!-- HUD: immer sichtbar. Links die Packs, Mitte die nächste Quest wie ein Ortsname, rechts der Code des Kästchens -->
    <header class="hud">
      <button class="hud-packs" id="hudPacks" type="button" aria-label="Packs">
        <span class="pack-row" id="packRow" aria-hidden="true"></span>
        <span class="hud-num gold-text" id="packsVal">0</span>
      </button>
      <button class="hud-next" id="hudNext" type="button">
        <span class="hud-next-ic" id="hudNextIc" aria-hidden="true"></span>
        <span class="hud-next-name gold-text" id="hudNextName">…</span>
      </button>
      <button class="hud-code" id="hudCode" type="button" aria-label="Code des Kästchens">
        <svg class="lock" aria-hidden="true"><use href="#i-lock"></use></svg>
        <span class="tumblers" id="tumblers"></span>
      </button>
    </header>

    <!-- Seitenleiste: aktive Seite groß, die Nachbarn klein. Tippen oder Wischen wechselt -->
    <nav class="tabs" id="tabs" aria-label="Seiten">
      <button class="tab tab-prev" type="button" data-nav="prev"><span class="chev" aria-hidden="true">‹</span><span class="tab-name" id="tabPrev"></span></button>
      <h2 class="tab-now"><span class="gem-orn" aria-hidden="true"></span><span class="gold-text" id="tabNow">QUESTS</span><span class="gem-orn" aria-hidden="true"></span></h2>
      <button class="tab tab-next" type="button" data-nav="next"><span class="tab-name" id="tabNext"></span><span class="chev" aria-hidden="true">›</span></button>
    </nav>

    <div class="stage">
      <div class="pages" id="pages">

        <!-- Seite 0: KARTE · Wo stehe ich, was liegt noch vor mir? -->
        <section class="face face-map glass" data-page="0" aria-label="Karte">
          <div class="map-body">
            <div class="map-sheet" id="mapSheet">
              <svg class="map-terrain" viewBox="0 0 1000 420" preserveAspectRatio="none" aria-hidden="true">
                <defs>
                  <radialGradient id="m-paper" cx="50%" cy="45%" r="75%"><stop offset="0" stop-color="#f1e7bf"/><stop offset=".7" stop-color="#e3d5a2"/><stop offset="1" stop-color="#c9b47a"/></radialGradient>
                  <linearGradient id="m-hill" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#97ad62"/><stop offset=".55" stop-color="#78924a"/><stop offset="1" stop-color="#58703a"/></linearGradient>
                  <linearGradient id="m-back" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#b8bd8a"/><stop offset="1" stop-color="#9aa56e"/></linearGradient>
                  <linearGradient id="m-lake" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#8cc0c8"/><stop offset="1" stop-color="#4a8494"/></linearGradient>
                  <symbol id="m-tree" viewBox="0 0 20 30"><path d="M10 0 20 24H0Z" fill="#46642e"/><path d="M10 0 20 24H10Z" fill="#2f4a22"/><path d="M10 6 16 19H4Z" fill="#577a38" opacity=".55"/><rect x="8.6" y="24" width="2.8" height="5" fill="#5a3e22"/></symbol>
                  <filter id="m-glow" x="-10%" y="-40%" width="120%" height="180%"><feGaussianBlur stdDeviation="3"/></filter>
                </defs>
                <path fill="url(#m-paper)" d="M0 0H1000V420H0Z"/>
                <path class="t-far" d="M0 150 60 120 110 138 170 96 230 128 300 88 360 118 430 70 500 104 560 62 640 96 700 50 760 70 820 40 880 76 940 58 1000 84V420H0Z"/>
                <path fill="url(#m-back)" d="M0 200C90 150 170 170 250 130 330 90 380 110 450 90 540 60 600 80 680 50 730 30 780 40 830 36 900 30 950 60 1000 50V420H0Z"/>
                <path fill="url(#m-hill)" d="M0 300C120 270 200 282 300 240 400 200 470 214 560 180 650 146 720 122 780 104 840 118 900 160 1000 190V420H0Z"/>
                <path class="t-contour" d="M0 324C120 294 200 306 300 264 400 224 470 238 560 204 650 170 720 146 780 128 840 142 900 184 1000 214"/>
                <path class="t-contour" d="M0 350C120 320 200 332 300 290 400 250 470 264 560 230 650 196 720 172 780 154 840 168 900 210 1000 240"/>
                <path class="t-contour" d="M200 380C300 350 380 330 470 300 560 270 660 240 760 210 860 240 920 262 1000 276"/>
                <g class="t-trees">
                  <use href="#m-tree" x="296" y="224" width="14" height="21"/><use href="#m-tree" x="318" y="219" width="12" height="18"/><use href="#m-tree" x="340" y="213" width="14" height="21"/>
                  <use href="#m-tree" x="362" y="208" width="12" height="18"/><use href="#m-tree" x="384" y="202" width="14" height="21"/><use href="#m-tree" x="306" y="282" width="14" height="21"/>
                  <use href="#m-tree" x="330" y="276" width="12" height="18"/><use href="#m-tree" x="354" y="270" width="14" height="21"/><use href="#m-tree" x="378" y="264" width="12" height="18"/>
                  <use href="#m-tree" x="486" y="176" width="14" height="21"/><use href="#m-tree" x="508" y="171" width="12" height="18"/><use href="#m-tree" x="530" y="164" width="14" height="21"/>
                  <use href="#m-tree" x="552" y="158" width="12" height="18"/><use href="#m-tree" x="516" y="226" width="14" height="21"/><use href="#m-tree" x="540" y="219" width="12" height="18"/>
                  <use href="#m-tree" x="564" y="212" width="14" height="21"/><use href="#m-tree" x="660" y="196" width="12" height="18"/><use href="#m-tree" x="684" y="186" width="14" height="21"/>
                  <use href="#m-tree" x="800" y="196" width="12" height="18"/><use href="#m-tree" x="822" y="210" width="14" height="21"/><use href="#m-tree" x="846" y="224" width="12" height="18"/>
                </g>
                <path fill="url(#m-lake)" d="M0 336C110 318 210 342 300 328 380 316 440 352 480 420H0Z"/>
                <path class="t-wave" d="M36 372q10-5 20 0t20 0M150 392q10-5 20 0t20 0M250 360q10-5 20 0t20 0M96 404q10-5 20 0t20 0"/>
                <path class="t-rail" d="M0 392C40 376 70 352 100 332"/>
                <path class="t-route" id="mapRoute" d=""/>
                <path class="t-walked-glow" id="mapWalkedGlow" d="" filter="url(#m-glow)"/>
                <path class="t-walked" id="mapWalked" d=""/>
                <g class="t-compass" transform="translate(958 382)"><path d="M0-22 5 0 0 22-5 0Z" fill="#5a4424" opacity=".5"/><path d="M0-22 5 0H-5Z" fill="#8a2a1c" opacity=".7"/></g>
              </svg>
              <div class="map-fog" id="mapFog" hidden><i style="--l:-8%;--t:6%;--w:70%;--h:46%;--d:19s"></i><i style="--l:18%;--t:34%;--w:80%;--h:50%;--d:24s"></i><i style="--l:-4%;--t:58%;--w:66%;--h:44%;--d:21s"></i><i style="--l:30%;--t:-6%;--w:74%;--h:42%;--d:27s"></i><i style="--l:44%;--t:62%;--w:70%;--h:46%;--d:17s"></i></div>
              <div class="map-marks" id="mapMarks"></div>
            </div>
            <aside class="map-side">
              <div class="progress-block">
                <p class="lbl">PRÜFUNGEN <b id="cntKern">0/6</b></p>
                <div class="pips" id="pipsKern"></div>
                <p class="lbl">SIDEQUESTS <b id="cntSide">0</b></p>
                <div class="pips" id="pipsSide"></div>
              </div>
              <div class="station-box pane" id="stationBox"></div>
            </aside>
          </div>
        </section>

        <!-- Seite 1: QUESTS · Was ist dran, was ist geschafft? (Startseite) -->
        <section class="face face-quests glass" data-page="1" aria-label="Quests">
          <div class="quests-body">
            <div class="list-col">
              <p class="list-legend" id="listLegend"></p>
              <ol class="quest-list" id="questList"></ol>
            </div>
            <article class="quest-card pane" id="questCard" aria-live="polite"></article>
          </div>
        </section>

        <!-- Seite 2: AUSRÜSTUNG · Was habe ich dabei? -->
        <section class="face face-equip glass" data-page="2" aria-label="Ausrüstung">
          <div class="equip-body">
            <div class="equip-group">
              <p class="lbl">ITEMS</p>
              <div class="slots" id="slotsGear"></div>
            </div>
            <div class="character-window" aria-hidden="true">
              <span class="cw-cone"></span><span class="cw-floor"></span>
              <img src="assets/dennis-v9.png" alt="">
            </div>
            <div class="equip-group">
              <p class="lbl">FÄHIGKEITEN</p>
              <div class="slots tri" id="slotsSkill"></div>
            </div>
            <div class="item-box pane" id="itemBox" aria-live="polite"></div>
          </div>
        </section>

      </div>
    </div>

    <footer class="foot">
      <span class="demo-bar" id="demoBar" hidden>
        <b>DEMO</b>
        <button type="button" data-demo="bestanden">Nächste bestanden</button>
        <button type="button" data-demo="verloren">Nächste verloren</button>
        <button type="button" data-demo="zurueck">Zurück</button>
      </span>
      <span class="sync" id="sync"></span>
    </footer>

    <!-- Die Fee: Cursor im Menü, fliegt zu allem, was Dennis antippt -->
    <canvas class="fairy-fx" id="fairyFx" aria-hidden="true"></canvas>
    <img class="fairy" id="fairy" src="assets/intro-fee.png" alt="" aria-hidden="true" draggable="false">

    <!-- Ergebnis-Fenster: nach einer Quest als Vollbild-Moment, sonst als kleine Tafel -->
    <div class="overlay" id="overlay" hidden>
      <div class="ov-shade"></div>
      <div class="ov-beam" aria-hidden="true"></div>
      <canvas class="ov-fx" id="ovFx" aria-hidden="true"></canvas>
      <div class="result" role="dialog" aria-modal="true" aria-labelledby="resultTitle">
        <div class="result-head" id="resultHead"></div>
        <ul class="result-lines" id="resultLines"></ul>
        <p class="result-next" id="resultNext"></p>
        <span class="result-more" aria-hidden="true"></span>
      </div>
    </div>

    <div class="rotate-hint" aria-hidden="true">
      <div class="phone"></div>
      <p>Handy quer halten</p>
    </div>
  </div>

  <svg class="svg-sprite" aria-hidden="true">
    <defs>
      <linearGradient id="g-gold" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff4c0"/><stop offset=".35" stop-color="#f2cc52"/><stop offset=".7" stop-color="#b8860b"/><stop offset="1" stop-color="#6b4a08"/></linearGradient>
      <radialGradient id="g-coin" cx="38%" cy="30%" r="75%"><stop offset="0" stop-color="#fff6c8"/><stop offset=".35" stop-color="#f2cc52"/><stop offset=".75" stop-color="#b8860b"/><stop offset="1" stop-color="#6b4a08"/></radialGradient>
      <linearGradient id="g-cardred" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#e2493a"/><stop offset="1" stop-color="#7c1812"/></linearGradient>
      <linearGradient id="g-brass" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#f5df98"/><stop offset=".45" stop-color="#c79c3f"/><stop offset="1" stop-color="#6e5218"/></linearGradient>
      <linearGradient id="g-steel" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#7d8894"/><stop offset=".45" stop-color="#ffffff"/><stop offset=".56" stop-color="#c9d2dc"/><stop offset="1" stop-color="#5f6a76"/></linearGradient>
      <linearGradient id="g-rim" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#f4f6fa"/><stop offset=".5" stop-color="#a9b3bf"/><stop offset="1" stop-color="#58616c"/></linearGradient>
      <linearGradient id="g-hylia" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#4658cc"/><stop offset=".55" stop-color="#1f2c92"/><stop offset="1" stop-color="#0e1552"/></linearGradient>
      <linearGradient id="g-violet" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#8a7af0"/><stop offset="1" stop-color="#34258e"/></linearGradient>
      <radialGradient id="g-leather" cx="40%" cy="35%" r="70%"><stop offset="0" stop-color="#c98a48"/><stop offset=".6" stop-color="#8a5526"/><stop offset="1" stop-color="#4c2a10"/></radialGradient>
      <linearGradient id="g-leather-dk" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#a86d34"/><stop offset="1" stop-color="#5a3414"/></linearGradient>
      <linearGradient id="g-plastic" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#7fd0ff"/><stop offset=".5" stop-color="#2f86d8"/><stop offset="1" stop-color="#18498a"/></linearGradient>
      <linearGradient id="g-tank" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#e6fbff" stop-opacity=".9"/><stop offset="1" stop-color="#9edcf2" stop-opacity=".75"/></linearGradient>
      <linearGradient id="g-orange" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffc06a"/><stop offset="1" stop-color="#e2671c"/></linearGradient>
      <linearGradient id="g-rope" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#f3dcaa"/><stop offset=".5" stop-color="#cfa66a"/><stop offset="1" stop-color="#8a6434"/></linearGradient>
    </defs>

    <!-- Pack: glänzende Spielkarte im Goldrahmen mit Totenkopf (One Piece) -->
    <symbol id="i-card" viewBox="0 0 22 30">
      <rect x=".8" y=".8" width="20.4" height="28.4" rx="2.8" fill="url(#g-gold)" stroke="#3b2605" stroke-width="1"/>
      <rect x="3.2" y="3.2" width="15.6" height="23.6" rx="1.4" fill="url(#g-cardred)"/>
      <rect x="3.7" y="3.7" width="14.6" height="22.6" rx="1.1" fill="none" stroke="rgba(255,236,180,.4)" stroke-width=".6"/>
      <path d="M11 8.2a4.3 4.3 0 0 1 4.3 4.3c0 1.7-.9 2.7-1.9 3.3v1.6H8.6v-1.6c-1-.6-1.9-1.6-1.9-3.3A4.3 4.3 0 0 1 11 8.2Z" fill="#fff3d1"/>
      <circle cx="9.4" cy="12.6" r="1.05" fill="#7c1812"/><circle cx="12.6" cy="12.6" r="1.05" fill="#7c1812"/>
      <path d="M6.4 20.4 15.6 23.6M15.6 20.4 6.4 23.6" stroke="#fff3d1" stroke-width="1.6" stroke-linecap="round"/>
      <path d="M1.6 9.5 9.5 1.6h4L1.6 13.5Z" fill="#fff" opacity=".26"/>
    </symbol>
    <!-- Pack, der noch dem Bund gehört: nur ein blasser Umriss -->
    <symbol id="i-card-empty" viewBox="0 0 22 30">
      <rect x="1" y="1" width="20" height="28" rx="2.6" fill="rgba(236,228,196,.06)" stroke="rgba(230,187,56,.5)" stroke-width="1.1"/>
      <path d="M11 9.4a3.4 3.4 0 0 1 3.4 3.4c0 1.3-.7 2.1-1.5 2.6v1.3H9.1v-1.3c-.8-.5-1.5-1.3-1.5-2.6A3.4 3.4 0 0 1 11 9.4Z" fill="rgba(236,228,196,.13)"/>
    </symbol>
    <!-- Schloss aus Messing -->
    <symbol id="i-lock" viewBox="0 0 24 28">
      <path d="M6.5 12.5V8.5a5.5 5.5 0 0 1 11 0v4" fill="none" stroke="url(#g-steel)" stroke-width="3"/>
      <rect x="2" y="11.5" width="20" height="15.5" rx="2.5" fill="url(#g-brass)" stroke="#4a3308" stroke-width=".8"/>
      <path d="M3.5 13.5h17" stroke="#fff4c8" stroke-width=".8" opacity=".6"/>
      <circle cx="12" cy="17.6" r="2.3" fill="#2a1c05"/><rect x="10.9" y="18.6" width="2.2" height="4.6" rx="1" fill="#2a1c05"/>
    </symbol>

    <!-- Items: gerendert mit Verlauf, Glanzlicht und Kante -->
    <symbol id="i-pouch" viewBox="0 0 64 64">
      <path d="M17 27C9 35 9 51 20 57c7 4 17 4 24 0 11-6 11-22 3-30Z" fill="url(#g-leather)" stroke="#3a1f0a" stroke-width="1.4"/>
      <path d="M21 16c4 4 18 4 22 0l4 11c-7 4-23 4-30 0Z" fill="url(#g-leather-dk)" stroke="#3a1f0a" stroke-width="1.2"/>
      <path d="M19 12c5 4 21 4 26 0l-2 6c-5 3-17 3-22 0Z" fill="#b8793a" stroke="#3a1f0a" stroke-width="1.1"/>
      <path d="M17 27c8 5 22 5 30 0" fill="none" stroke="#f2cc52" stroke-width="2.6" stroke-linecap="round"/>
      <path d="M41 29c2 6 0 10 3 15M44 44l-1.5 4M44 44l2 3.5" fill="none" stroke="#e6bb38" stroke-width="1.8" stroke-linecap="round"/>
      <circle cx="41" cy="29.5" r="2.4" fill="#f6dc7a" stroke="#6b4a08" stroke-width=".8"/>
      <path d="M15 39c1 11 9 16 17 16" fill="none" stroke="#f4d7a8" stroke-width="1" stroke-dasharray="2 2.2" opacity=".55"/>
      <path d="M28 37 32 30l4 7Zm-4 7 4-7 4 7Zm8 0 4-7 4 7Z" fill="#f2cc52" opacity=".85"/>
      <ellipse cx="22" cy="38" rx="3.4" ry="7.5" transform="rotate(18 22 38)" fill="#fff" opacity=".16"/>
    </symbol>
    <symbol id="i-pistol" viewBox="0 0 64 64">
      <rect x="20" y="7" width="24" height="17" rx="7" fill="url(#g-tank)" stroke="#1d5a86" stroke-width="1.3"/>
      <path d="M21.5 16h21v1c0 3.4-2.6 5.6-6 5.6h-9c-3.4 0-6-2.2-6-5.6Z" fill="#3aa0e0" opacity=".85"/>
      <circle cx="27" cy="18.5" r="1.3" fill="#fff" opacity=".7"/><circle cx="33" cy="17.5" r=".9" fill="#fff" opacity=".7"/><circle cx="37" cy="20" r="1.1" fill="#fff" opacity=".6"/>
      <rect x="29" y="4" width="6" height="4" rx="1.4" fill="url(#g-orange)" stroke="#8a3a0c" stroke-width=".8"/>
      <path d="M23 9.5h6" stroke="#fff" stroke-width="1.6" stroke-linecap="round" opacity=".8"/>
      <path d="M5 26h44l4-2h7v10h-7l-4-2H29l-3 5v3h-5l-4 18H8l4-19-7-4Z" fill="url(#g-plastic)" stroke="#0f2f5c" stroke-width="1.4" stroke-linejoin="round"/>
      <path d="M53 24h7v10h-7Z" fill="url(#g-orange)" stroke="#8a3a0c" stroke-width="1"/>
      <path d="M24 38c3 .3 4.6 2.4 4.4 5.4" fill="none" stroke="url(#g-orange)" stroke-width="2.8" stroke-linecap="round"/>
      <path d="M8 28.5h40" stroke="#fff" stroke-width="1.8" stroke-linecap="round" opacity=".45"/>
      <path d="M13 42l-2.6 13" stroke="#fff" stroke-width="1.2" stroke-linecap="round" opacity=".3"/>
    </symbol>
    <symbol id="i-ropering" viewBox="0 0 64 64">
