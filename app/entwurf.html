<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#080907">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Dennis Quest">
  <meta name="robots" content="noindex">
  <title>Dennis Quest · Entwurf</title>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cpath fill='%23d8aa2d' d='M16 2 29 26H3z'/%3E%3Cpath fill='%2349602d' d='m16 9 7 14H9z'/%3E%3C/svg%3E">
  <link rel="apple-touch-icon" href="assets/touch-icon.png">
  <link rel="stylesheet" href="entwurf.css">
</head>
<body>
  <!-- ENTWURF zu 06-design-plan.md. Die App (index.html) bleibt unverändert, bis der Plan freigegeben ist.
       entwurf.html        liest den echten Stand (Firebase), schreibt nichts
       entwurf.html?demo   Beispielstand aus 05-system-plan.md A9, mit Demo-Knöpfen, ohne Firebase -->
  <div class="game" id="game">
    <img class="world" src="assets/alpine-trail.png" alt="">
    <div class="world-shade" aria-hidden="true"></div>

    <section class="intro-screen" id="introScreen" aria-label="Startbildschirm">
      <img class="intro-avatar" src="assets/dennis-v9.png" alt="" aria-hidden="true">
      <div class="intro-copy">
        <p class="intro-kicker">DIE PRÜFUNG DES BUNDES</p>
        <div class="intro-crest" aria-hidden="true"><span></span><span></span><span></span></div>
        <h1 class="intro-title"><span>DENNIS</span> QUEST</h1>
        <p class="intro-place">TEGERNSEE · 2026</p>
        <button class="start-quest" id="startQuest" type="button">JGA QUEST STARTEN</button>
      </div>
    </section>

    <!-- HUD: immer sichtbar. Links die Packs, Mitte die nächste Quest, rechts der Code des Kästchens -->
    <header class="hud">
      <button class="hud-packs" id="hudPacks" type="button" aria-label="Packs">
        <span class="pack-row" id="packRow" aria-hidden="true"></span>
        <span class="hud-num"><b id="packsVal">0</b><small id="packsMax">/10</small></span>
      </button>
      <button class="hud-next" id="hudNext" type="button">
        <span class="hud-next-label">NÄCHSTE QUEST</span>
        <span class="hud-next-name" id="hudNextName">…</span>
      </button>
      <button class="hud-code" id="hudCode" type="button" aria-label="Code des Kästchens">
        <svg class="lock" aria-hidden="true"><use href="#i-lock"></use></svg>
        <span class="tumblers" id="tumblers"></span>
      </button>
      <button class="fullscreen-toggle" id="fullscreenToggle" type="button" aria-label="Vollbild öffnen" aria-pressed="false" title="Vollbild">
        <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2.4" d="M3 8V5a2 2 0 0 1 2-2h3m8 0h3a2 2 0 0 1 2 2v3m0 8v3a2 2 0 0 1-2 2h-3m-8 0H5a2 2 0 0 1-2-2v-3"/></svg>
      </button>
    </header>

    <button class="shoulder shoulder-left" type="button" data-nav="prev" aria-label="Vorherige Seite (Z)"><span>Z</span></button>
    <button class="shoulder shoulder-right" type="button" data-nav="next" aria-label="Nächste Seite (R)"><span>R</span></button>

    <div class="stage">
      <div class="menu-viewport">
        <div class="menu-cube flat" id="menuCube">

          <!-- Seite 0: KARTE · Wo stehe ich, was liegt noch vor mir? -->
          <section class="face face-map" data-page="0" aria-label="Karte">
            <header class="face-head">
              <button class="nav-hint prev" type="button" data-nav="prev">AUSRÜSTUNG</button>
              <h2>KARTE</h2>
              <button class="nav-hint next" type="button" data-nav="next">QUESTS</button>
            </header>
            <div class="map-body">
              <div class="map-sheet" id="mapSheet">
                <svg class="map-terrain" viewBox="0 0 1000 420" preserveAspectRatio="none" aria-hidden="true">
                  <path class="t-sky" d="M0 0H1000V420H0Z"/>
                  <path class="t-back" d="M0 200 C90 150 170 170 250 130 C330 90 380 110 450 90 C540 60 600 80 680 50 C730 30 780 40 830 36 C900 30 950 60 1000 50 V420 H0Z"/>
                  <path class="t-front" d="M0 300 C120 270 200 282 300 240 C400 200 470 214 560 180 C650 146 720 122 780 104 C840 118 900 160 1000 190 V420 H0Z"/>
                  <path class="t-forest" d="M316 292 l14 -30 14 30Z M346 286 l12 -26 12 26Z M392 262 l14 -30 14 30Z M424 258 l12 -26 12 26Z M512 236 l14 -30 14 30Z M544 230 l12 -26 12 26Z M600 204 l14 -30 14 30Z M632 196 l12 -26 12 26Z M688 176 l12 -26 12 26Z"/>
                  <path class="t-lake" d="M0 336 C110 318 210 342 300 328 C380 316 440 352 480 420 H0Z"/>
                  <path class="t-rail" d="M0 392 C40 376 70 352 100 332"/>
                  <path class="t-route" id="mapRoute" d=""/>
                </svg>
                <div class="map-fog" id="mapFog" hidden></div>
                <div class="map-marks" id="mapMarks"></div>
              </div>
              <aside class="map-side">
                <div class="progress-block">
                  <p class="lbl">PRÜFUNGEN <b id="cntKern">0/6</b></p>
                  <div class="pips" id="pipsKern"></div>
                  <p class="lbl">SIDEQUESTS <b id="cntSide">0/7</b></p>
                  <div class="pips" id="pipsSide"></div>
                  <p class="left-count" id="leftCount"></p>
                </div>
                <div class="station-box textbox" id="stationBox"></div>
              </aside>
            </div>
          </section>

          <!-- Seite 1: QUESTS · Was ist dran, was ist geschafft? (Startseite) -->
          <section class="face face-quests" data-page="1" aria-label="Quests">
            <header class="face-head">
              <button class="nav-hint prev" type="button" data-nav="prev">KARTE</button>
              <h2>QUESTS</h2>
              <button class="nav-hint next" type="button" data-nav="next">AUSRÜSTUNG</button>
            </header>
            <div class="quests-body">
              <div class="list-col">
                <p class="list-legend" id="listLegend"></p>
                <ol class="quest-list" id="questList"></ol>
              </div>
              <article class="quest-card textbox" id="questCard" aria-live="polite"></article>
            </div>
          </section>

          <!-- Seite 2: AUSRÜSTUNG · Was habe ich dabei? -->
          <section class="face face-equip" data-page="2" aria-label="Ausrüstung">
            <header class="face-head">
              <button class="nav-hint prev" type="button" data-nav="prev">QUESTS</button>
              <h2>AUSRÜSTUNG</h2>
              <button class="nav-hint next" type="button" data-nav="next">KARTE</button>
            </header>
            <div class="equip-body">
              <div class="equip-group">
                <p class="lbl">ITEMS</p>
                <div class="slots" id="slotsGear"></div>
              </div>
              <div class="character-window">
                <img src="assets/dennis-v9.png" alt="Dennis als Abenteurer">
                <span>DENNIS · STUFE VERLOBTER</span>
              </div>
              <div class="equip-group">
                <p class="lbl">FÄHIGKEITEN</p>
                <div class="slots" id="slotsSkill"></div>
              </div>
              <div class="item-box textbox" id="itemBox" aria-live="polite"></div>
            </div>
          </section>

        </div>
      </div>
    </div>

    <footer class="foot">
      <span class="demo-bar" id="demoBar" hidden>
        <b>DEMO</b>
        <button type="button" data-demo="bestanden">Nächste bestanden</button>
        <button type="button" data-demo="verloren">Nächste verloren</button>
        <button type="button" data-demo="zurueck">Zurück</button>
      </span>
      <span class="hint" id="hint">Wischen oder Z / R: Seite wechseln · Tippen: Details</span>
      <span class="sync" id="sync"></span>
    </footer>

    <!-- Ergebnis-Fenster: erscheint, wenn der Quest Master etwas bucht -->
    <div class="overlay" id="overlay" hidden>
      <div class="result textbox" role="dialog" aria-modal="true" aria-labelledby="resultTitle">
        <div class="result-head" id="resultHead"></div>
        <ul class="result-lines" id="resultLines"></ul>
        <p class="result-next" id="resultNext"></p>
        <span class="result-more" aria-hidden="true">▼</span>
      </div>
    </div>

    <div class="rotate-hint" aria-hidden="true">
      <div class="phone"></div>
      <p>Dreh dein Handy ins Querformat.</p>
    </div>
    <div class="dither" aria-hidden="true"></div>
  </div>

  <svg class="svg-sprite" aria-hidden="true">
    <!-- Pack: Spielkarte im Goldrahmen -->
    <symbol id="i-card" viewBox="0 0 22 30">
      <rect x="1" y="1" width="20" height="28" rx="2.6" fill="#f2c94c" stroke="#3b2605" stroke-width="1.4"/>
      <rect x="3.8" y="3.8" width="14.4" height="22.4" rx="1.2" fill="#b3261e"/>
      <path d="M11 8.2a4.3 4.3 0 0 1 4.3 4.3c0 1.7-.9 2.7-1.9 3.3v1.6H8.6v-1.6c-1-.6-1.9-1.6-1.9-3.3A4.3 4.3 0 0 1 11 8.2Z" fill="#fff3d1"/>
      <circle cx="9.4" cy="12.6" r="1.05" fill="#b3261e"/><circle cx="12.6" cy="12.6" r="1.05" fill="#b3261e"/>
      <path d="M6.4 20.4 15.6 23.6M15.6 20.4 6.4 23.6" stroke="#fff3d1" stroke-width="1.6" stroke-linecap="round"/>
    </symbol>
    <!-- Pack, der noch dem Bund gehört: nur der Rahmen -->
    <symbol id="i-card-empty" viewBox="0 0 22 30">
      <rect x="1" y="1" width="20" height="28" rx="2.6" fill="rgba(20,18,10,.55)" stroke="#8c8466" stroke-width="1.4" stroke-dasharray="2.2 1.6"/>
      <path d="M11 9.4a3.4 3.4 0 0 1 3.4 3.4c0 1.3-.7 2.1-1.5 2.6v1.3H9.1v-1.3c-.8-.5-1.5-1.3-1.5-2.6A3.4 3.4 0 0 1 11 9.4Z" fill="rgba(239,232,200,.16)"/>
    </symbol>
    <symbol id="i-lock" viewBox="0 0 24 28">
      <path d="M6.5 12.5V8.5a5.5 5.5 0 0 1 11 0v4" fill="none" stroke="currentColor" stroke-width="3"/>
      <rect x="2" y="11.5" width="20" height="15.5" rx="2.5" fill="currentColor"/>
      <circle cx="12" cy="17.6" r="2.3" fill="#1c1a12"/><rect x="10.9" y="18.6" width="2.2" height="4.6" rx="1" fill="#1c1a12"/>
    </symbol>
    <!-- Items -->
    <symbol id="i-backpack" viewBox="0 0 512 512"><path fill="currentColor" d="M186 21 173 47c7 0 14-1 21-1l4-7h116l4 7 21 1-13-26H186Zm70 42c-46 0-91 2-135 5-4 50-9 101-1 146 89 12 180 13 273 0 7-31 5-85-1-146-44-3-90-5-136-5Zm0 29c33 0 65 3 98 9l7 1v8c0 15 2 35-13 50-10 10-26 17-51 20v19h-82v-19c-24-4-39-10-49-20-15-15-15-34-15-50v-8l7-1c33-6 65-9 98-9Zm-71 179v219c48 2 95 2 142 0V271c-48 2-95 2-142 0Z"/></symbol>
    <symbol id="i-pistol" viewBox="0 0 32 32"><g fill="currentColor"><rect x="9" y="4.5" width="12" height="7.5" rx="3"/><path d="M2.5 13H25l2-1h3v5h-3l-2-1H14.4l-1.6 2.4v1.4h-2.3L9.2 28.5H4.2l2.1-10.2L2.5 16.6Z"/></g><path d="M12.4 19.6c1.5.2 2.4 1.3 2.3 2.9" fill="none" stroke="currentColor" stroke-width="1.6"/><rect x="10.5" y="6" width="3" height="4.5" rx="1.2" fill="rgba(255,255,255,.35)"/></symbol>
    <symbol id="i-ropering" viewBox="0 0 32 32"><circle cx="16" cy="16" r="10.4" fill="none" stroke="currentColor" stroke-width="5.4"/><circle cx="16" cy="16" r="10.4" fill="none" stroke="rgba(0,0,0,.32)" stroke-width="5.4" stroke-dasharray="2.2 2.6"/></symbol>
    <symbol id="i-cards" viewBox="0 0 32 32"><g fill="currentColor"><rect x="4" y="8" width="14.5" height="20" rx="2" transform="rotate(-14 11.25 18)" opacity=".6"/><rect x="12.5" y="3.5" width="14.5" height="20" rx="2" transform="rotate(9 19.75 13.5)"/></g><path d="M15.6 7.4 23.8 8.7" transform="rotate(9 19.75 13.5)" stroke="rgba(255,255,255,.75)" stroke-width="1.7" stroke-linecap="round"/><path d="M15 11.3 18.8 11.9" transform="rotate(9 19.75 13.5)" stroke="rgba(255,255,255,.5)" stroke-width="1.4" stroke-linecap="round"/></symbol>
    <symbol id="i-token" viewBox="0 0 32 32"><circle cx="16" cy="16" r="13.2" fill="currentColor"/><circle cx="16" cy="16" r="10.2" fill="none" stroke="rgba(0,0,0,.33)" stroke-width="1.6"/><path d="m16 8.4 2.3 4.7 5.1.7-3.7 3.6.9 5.1-4.6-2.4-4.6 2.4.9-5.1-3.7-3.6 5.1-.7Z" fill="rgba(0,0,0,.38)"/></symbol>
    <symbol id="i-sword" viewBox="0 0 512 512"><path fill="currentColor" d="M437 75 355 106 194 267c1 2 1 4 1 6 0 14-12 26-26 26s-26-12-26-26c0-1 0-3 1-4-13 13-20 31-20 48 14 0 28 4 40 13-20 12-45 37-57 57-4-2-7-4-11-5-6-2-10-1-12 2s-2 7 0 12c3 13 19 29 32 32 6 2 9 0 11-1 2-2 3-6 2-12-1-4-3-8-6-12 20-12 46-37 57-57 10 12 15 27 15 42 17 0 34-6 48-19h-2c-14 0-26-12-26-26s12-26 26-26h4l161-161 31-82Z"/></symbol>
    <symbol id="i-shield" viewBox="0 0 32 32"><path d="M16 2.5 28 6.5v8.4c0 7.1-5.1 12.2-12 14.6C9.1 27.1 4 22 4 14.9V6.5Z" fill="currentColor"/><path d="M16 7.4 23.6 10v5c0 4.4-3.1 7.6-7.6 9.3C11.5 22.6 8.4 19.4 8.4 15v-5Z" fill="rgba(0,0,0,.26)"/><path d="M16 10.6v10.2M11.4 14.6h9.2" stroke="rgba(255,255,255,.6)" stroke-width="2.2"/></symbol>
    <!-- Embleme der sechs Prüfungen (Medaillons) -->
    <symbol id="e-book" viewBox="0 0 32 32"><path fill="currentColor" d="M15.2 9.2C12.2 7 8.2 6.2 3.8 6.6v17.2c4.4-.3 8.4.5 11.4 2.6ZM16.8 9.2C19.8 7 23.8 6.2 28.2 6.6v17.2c-4.4-.3-8.4.5-11.4 2.6Z"/></symbol>
    <symbol id="e-swords" viewBox="0 0 32 32"><g fill="currentColor"><g transform="rotate(45 16 16)"><path d="M14.7 2.5h2.6v18.2h-2.6z"/><rect x="10.8" y="20.4" width="10.4" height="2.6" rx="1"/><rect x="14.8" y="22.6" width="2.4" height="6" rx="1"/></g><g transform="rotate(-45 16 16)"><path d="M14.7 2.5h2.6v18.2h-2.6z"/><rect x="10.8" y="20.4" width="10.4" height="2.6" rx="1"/><rect x="14.8" y="22.6" width="2.4" height="6" rx="1"/></g></g></symbol>
    <symbol id="e-eye" viewBox="0 0 32 32"><path fill="currentColor" fill-rule="evenodd" d="M2.2 16C5.8 9.6 10.5 6.8 16 6.8S26.2 9.6 29.8 16c-3.6 6.4-8.3 9.2-13.8 9.2S5.8 22.4 2.2 16ZM16 10.6a5.4 5.4 0 1 0 0 10.8 5.4 5.4 0 1 0 0-10.8ZM16 13.4a2.6 2.6 0 1 0 0 5.2 2.6 2.6 0 1 0 0-5.2Z"/></symbol>
    <symbol id="e-flame" viewBox="0 0 32 32"><path fill="currentColor" fill-rule="evenodd" d="M16 2.5c1.6 5 9 7.6 9 16.2a9 9 0 0 1-18 0c0-4.6 2.5-7.1 4.5-9.6.5 2.5 1.5 3.8 3 4.5-.7-4.5 0-8 1.5-11.1ZM16 16c1 2.3 3.6 3.3 3.6 6.3a3.6 3.6 0 0 1-7.2 0c0-2.2 2.2-3.4 3.6-6.3Z"/></symbol>
    <symbol id="e-triforce" viewBox="0 0 32 32"><path fill="currentColor" d="M16 3.2 22.4 14.4H9.6ZM9.4 15.4l6.4 11.2H3ZM22.6 15.4 29 26.6H16.2Z"/></symbol>
    <symbol id="e-letter" viewBox="0 0 32 32"><path fill="currentColor" fill-rule="evenodd" d="M3 8h26v17H3ZM4.6 9.3 16 17.6 27.4 9.3v1.6L16 19.3 4.6 10.9Z"/><circle cx="16" cy="19.2" r="3.4" fill="currentColor"/></symbol>
    <!-- Sidequest: Stein -->
    <symbol id="i-gem" viewBox="0 0 32 32"><path d="M9 5h14l6 8-13 15L3 13Z" fill="currentColor"/><path d="M3 13h26M9 5l4 8 3 15 3-15 4-8M13 13l3-8 3 8" fill="none" stroke="rgba(0,0,0,.3)" stroke-width="1.2"/><path d="M9 5h14l-3 8h-8Z" fill="rgba(255,255,255,.3)"/></symbol>
    <!-- Zeichen -->
    <symbol id="i-check" viewBox="0 0 16 16"><path d="M2.6 8.6 6.3 12l7.1-8" fill="none" stroke="currentColor" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"/></symbol>
    <symbol id="i-x" viewBox="0 0 16 16"><path d="m4 4 8 8m0-8-8 8" fill="none" stroke="currentColor" stroke-width="2.8" stroke-linecap="round"/></symbol>
    <symbol id="i-hut" viewBox="0 0 32 32"><path fill="currentColor" d="M3 15 16 4l13 11h-3v12H6V15Z"/><path d="M13.5 27v-7h5v7" fill="#2c2418"/></symbol>
    <symbol id="i-train" viewBox="0 0 32 32"><path fill="currentColor" d="M8 4h16a3 3 0 0 1 3 3v15a3 3 0 0 1-3 3l2.5 4h-3.2L21 25H11l-2.3 4H5.5L8 25a3 3 0 0 1-3-3V7a3 3 0 0 1 3-3Z"/><path d="M8 8h16v7H8Z" fill="#cfe3e8"/><circle cx="10.5" cy="20" r="1.8" fill="#f2c94c"/><circle cx="21.5" cy="20" r="1.8" fill="#f2c94c"/></symbol>
  </svg>

  <script src="config.js"></script>
  <script src="engine.js"></script>
  <script src="store.js"></script>
  <script src="entwurf.js"></script>
</body>
</html>
