# Veröffentlicht den Ordner app/ auf GitHub Pages, bei jedem Push auf main.
# Kostenlos und ohne Deploy-Kontingent (das Repo ist öffentlich), anders als der Free-Plan von Netlify.
# Einmalig nötig: Repo → Settings → Pages → Build and deployment → Source: „GitHub Actions“.
# Adresse danach: https://lifetimelongevity-cmd.github.io/ocarina/ (Admin: …/ocarina/admin.html)
name: Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: app
      - id: deployment
        uses: actions/deploy-pages@v4
